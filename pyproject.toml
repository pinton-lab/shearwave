[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shearwave"
version = "0.1.0"
description = "Viscoelastic FDTD shear wave solver with Kelvin-Voigt damping"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Gianmarco F Pinton" },
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
jax = ["jax[cpu]"]
jax-gpu = ["jax[cuda12]"]
viz = ["matplotlib"]
fullwave = ["fullwave25"]
dev = ["pytest", "ruff", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/shearwave"]

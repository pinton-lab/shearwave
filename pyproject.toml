[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shearwave"
version = "0.1.0"
description = "Viscoelastic FDTD shear wave solver with Kelvin-Voigt damping"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Gianmarco F Pinton" },
]
keywords = [
    "FDTD",
    "shear wave",
    "elastography",
    "viscoelastic",
    "Kelvin-Voigt",
    "ultrasound",
    "radiation force",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/pinton-lab/shearwave"
Repository = "https://github.com/pinton-lab/shearwave"
Issues = "https://github.com/pinton-lab/shearwave/issues"

[project.optional-dependencies]
jax = ["jax[cpu]"]
jax-gpu = ["jax[cuda12]"]
viz = ["matplotlib"]
fullwave = ["fullwave25"]
dev = ["pytest", "ruff", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/shearwave"]
